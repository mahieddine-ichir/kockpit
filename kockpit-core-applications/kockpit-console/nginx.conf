server {
    listen 80;
    server_name localhost;

    # Serve React app
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api {
      proxy_pass __KOCKPIT_BACKEND__/api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # __INGEST_ROUTE_BEGIN__ removed at startup when KOCKPIT_GATEWAY is not set
    # Proxy audits and messages to the ingestion gateway
    location /ingest/ {
      proxy_pass __KOCKPIT_GATEWAY__;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # above the gateway's 1 MiB, so that the gateway itself answers a body that is too large
      client_max_body_size 2m;
    }
    # __INGEST_ROUTE_END__
}
