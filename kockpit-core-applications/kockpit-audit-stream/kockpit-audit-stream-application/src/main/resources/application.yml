server:
  port: 9080

spring:
  application:
    name: kockpit-audit-stream

management:
  endpoint:
    health:
      probes:
        enabled: true
  server:
    port: 9090

kockpit:
  audit:
    stream:
      opensearch:
        endpoints: ${OPENSEARCH_ENDPOINTS:http://localhost:9200}
        index_suffix: ${INDEX_SUFFIX:audit-data}
