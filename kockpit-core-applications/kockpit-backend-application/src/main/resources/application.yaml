server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: kockpit-backend-application
  main:
    allow-bean-definition-overriding: true
  kafka:
    bootstrap-servers:
      - ${BOOTSTRAP_SERVERS:localhost:9092}

management:
  server:
    port: 8090

logging:
  level:
    org.kockpit.communication: error

kockpit:
  domain: kockpit
  env: local
  appId: ${spring.application.name}

  security:
    # Local accounts (signup/login in the console) in PostgreSQL, instead of Cognito or an open API.
    # Turns manifest access control on; list the admin group in access-control.admin-groups.
    local:
      enabled: ${KOCKPIT_LOCAL_AUTH_ENABLED:false}
      # at least 32 bytes, the same on every replica
      jwt-secret: ${KOCKPIT_JWT_SECRET:}
      cookie-secure: ${KOCKPIT_COOKIE_SECURE:true}
      datasource:
        url: ${KOCKPIT_DB_URL:jdbc:postgresql://localhost:5432/kockpit}
        username: ${KOCKPIT_DB_USERNAME:kockpit}
        password: ${KOCKPIT_DB_PASSWORD:}
      # created at startup when absent
      admin:
        email: ${KOCKPIT_ADMIN_EMAIL:}
        password: ${KOCKPIT_ADMIN_PASSWORD:}
      signup:
        enabled: ${KOCKPIT_SIGNUP_ENABLED:true}
        invite-required: ${KOCKPIT_SIGNUP_INVITE_REQUIRED:true}
    access-control:
      # empty: on with Cognito or local accounts, off otherwise
      enabled: ${KOCKPIT_ACCESS_CONTROL_ENABLED:}
      admin-groups: ${KOCKPIT_ADMIN_GROUPS:}
      hide-unrestricted: ${KOCKPIT_HIDE_UNRESTRICTED_MANIFESTS:false}
    cors:
      allowed-origins: ${KOCKPIT_CORS_ALLOWED_ORIGINS:*}

  # Self-service tenants and API keys, with local accounts (kockpit.security.local.enabled)
  tenants:
    max-per-user: ${KOCKPIT_TENANTS_PER_USER:1}
    max-keys-per-tenant: ${KOCKPIT_KEYS_PER_TENANT:3}
    default-daily-quota: ${KOCKPIT_DEFAULT_DAILY_QUOTA:10000}
    max-envs: ${KOCKPIT_TENANT_MAX_ENVS:3}
    default-envs: ${KOCKPIT_TENANT_DEFAULT_ENVS:dev}
    # members (owner included), open invitations per tenant, and how long an invitation is valid
    max-members: ${KOCKPIT_TENANT_MAX_MEMBERS:20}
    max-open-invitations: ${KOCKPIT_TENANT_MAX_OPEN_INVITATIONS:5}
    invitation-ttl: ${KOCKPIT_TENANT_INVITATION_TTL:7d}

  # backend services
  backend:
    opensearch:
      endpoints: ${OPENSEARCH_ENDPOINTS:http://localhost:9200}
      index: ${INDEX_NAME:audit-data}
    manifests:
      azure:
        storage:
          account: ${MANIFESTS_STORAGE_ACCOUNT}
          endpoint: https://${kockpit.backend.manifests.azure.storage.account}.blob.core.windows.net
          key: ${MANIFESTS_STORAGE_KEY}
          container: ${MANIFESTS_STORAGE_CONTAINER:manifests}
      filesystem:
        path: ${FS_MANIFESTS_PATH}

  # comm layer
  communication:
    azure:
      storage:
        account: ${STORAGE_ACCOUNT}
        endpoint: https://${kockpit.communication.azure.storage.account}.blob.core.windows.net
        key: ${STORAGE_KEY}
        container: ${STORAGE_CONTAINER:data}
    aws:
    filesystem:
      path: ${FS_STORAGE_PATH}

  # application services
  audit:
    ttl_default_in_days: 1
    notification:
      kafka:
        topic: ${NOTIFICATION_TOPIC:audits}


  legacy:
    aws:
      region: eu-west-1

  manifests:
    # how often the manifest list is reloaded in the background (30s, 1m, PT30S...)
    cache:
      refresh: ${KOCKPIT_MANIFESTS_CACHE_REFRESH:30s}
    aws:
      s3:
        bucket: manifests