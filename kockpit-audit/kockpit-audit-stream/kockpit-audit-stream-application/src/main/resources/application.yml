server:
  port: 8080

spring:
  cloud:
    azure:
      eventhubs:
        namespace: rcu-dev
        event-hub-name: audit
        consumer:
          consumer-group: rcu-api
        #connection-string: Endpoint=sb://rcu-dev.servicebus.windows.net/;SharedAccessKeyName=audits-sender;SharedAccessKey=REMOVED_SAS_KEY;EntityPath=audit
        connection-string: Endpoint=sb://rcu-dev.servicebus.windows.net/;SharedAccessKeyName=Receiver;SharedAccessKey=REMOVED_SAS_KEY

management:
  endpoint:
    health:
      probes:
        enabled: true

kockpit:
  audit:
    stream:
      azure:
        endpoint: https://rcu-dev.search.windows.net
        index_name: audit