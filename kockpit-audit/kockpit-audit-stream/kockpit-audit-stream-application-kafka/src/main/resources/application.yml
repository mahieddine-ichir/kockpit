management:
  endpoint:
    health:
      probes:
        enabled: true

kockpit:
  audit:
    stream:
      kafka:
        topics: audit
      azure:
        search:
          endpoint: https://rcu-dev.search.windows.net
          index_name: audit-v2
          api_key: JAlCjsGXNDCnncUtpl1RzqiDO4DRisg8LURymqWX8KAzSeCr0p1w
          scheduler_ms: 10000
          fields: requestId,
