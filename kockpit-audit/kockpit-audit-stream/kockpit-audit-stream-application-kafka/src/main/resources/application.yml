server:
  port: 8080

spring:
  application:
    name: kockpit-audit-stream
  kafka:
    bootstrap-servers:
      - ${BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${spring.application.name}
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: ${SASL_JASS_CONFIG}

management:
  endpoint:
    health:
      probes:
        enabled: true

kockpit:
  audit:
    stream:
      kafka:
        topics: audit
      azure:
        search:
          endpoint: ${AZURESEARCH_ENDPOINT}
          index_name: ${AZURESEARCH_INDEX}
          api_key: ${AZURESEARCH_APIKEY}
          scheduler_ms: 10000
