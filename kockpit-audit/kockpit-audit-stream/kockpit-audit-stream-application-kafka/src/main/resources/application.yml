server:
  port: 8080

spring:
  application:
    name: kockpit-audit-stream
  kafka:
    bootstrap-servers:
      - rcu-dev.servicebus.windows.net:9093
    consumer:
      group-id: ${spring.application.name}
      properties:
        security.protocol: SASL_SSL
        sasl.mechanism: PLAIN
        sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="$ConnectionString" password="Endpoint=sb://rcu-dev.servicebus.windows.net/;SharedAccessKeyName=Receiver;SharedAccessKey=a6/A24w8V0ZWiIHHT9W5BIYZjesz1NZKt+AEhLlYbLQ=";
