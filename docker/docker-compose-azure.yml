# to load .env.azure config, use docker compose --env-file
services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./opensearch/data:/init-data
      - ./opensearch/scripts:/docker-entrypoint-init.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboards:
    image: opensearchproject/opensearch-dashboards:3.2.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true

  kockpit-backend-application:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-backend-application-azure:latest
    container_name: kockpit-backend-application
    ports:
      - "8080:8080"
    environment:
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_ACCOUNT=${STORAGE_ACCOUNT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_CONTAINER=${STORAGE_CONTAINER}
      - OPENSEARCH_ENDPOINTS=http://opensearch:9200
      - spring.profiles.include=azure
      - INDEX_NAME=audit-data
      - kockpit.sdk.service.audit.notification.topic=audits

  kockpit-console:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-console:latest
    container_name: kockpit-console
    ports:
      - "3000:80"
    environment:
      - KOCKPIT_BACKEND=http://kockpit-backend-application:8080/backend
    depends_on:
      - kockpit-backend-application

  kockpit-audit-stream-application:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-audit-stream-application-kafka:latest
    container_name: kockpit-audit-stream-application
    ports:
      - "9080:9080"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - OPENSEARCH_ENDPOINTS=http://opensearch:9200
      #- spring.profiles.include=kafka,eventhub -> on azure
      - spring.profiles.include=kafka
      - kockpit.audit.stream.kafka.topics=audits
    depends_on:
      - kafka
      - opensearch

  kockpit-sample-all:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-sample-all-azure:latest
    container_name: kockpit-sample-all
    ports:
      - "8081:8081"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KOCKPIT_SDK_DOMAIN=kockpit
      - KOCKPIT_SDK_ENV=local
      - KOCKPIT_SDK_APPID=sample-app
      - kockpit.sdk.service.audit.notification.topic=audits
    volumes:
      - ~/IdeaProjects/kockpit/data:/data
    links:
      - kafka:kafka
    depends_on:
      - kafka

volumes:
  opensearch-data:
