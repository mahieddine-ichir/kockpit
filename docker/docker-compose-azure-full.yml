# actually Azure do not offer storage account docker or service that one can run locally for tests.
# EventHub on azure, accepts the Kafka protocol, so we'll use the Kafka along with the kafka protocol.

services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=3

  opensearch:
    image: opensearchproject/opensearch:3
    container_name: opensearch
    ports:
      - "9200:9200"
    environment:
      - cluster.name=opensearch-cluster
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true

  opensearch-dashboard:
    image: opensearchproject/opensearch-dashboards:3
    container_name: opensearch-dashboard
    links:
      - opensearch:opensearch
    expose:
      - 5601
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: true
    depends_on:
      - opensearch

  kockpit-audit-stream-kafka:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-audit-stream-kafka:latest
    container_name: kockpit-audit-stream-kafka
    ports:
      - "9080:9080"
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - OPENSEARCH_ENDPOINTS=http://opensearch:9200
    depends_on:
      - kafka
      - opensearch

  kockpit-backend-application:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-backend-application-storageaccount:latest
    container_name: kockpit-backend-application
    ports:
      - "8080:8080"
    environment:
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_ACCOUNT=${STORAGE_ACCOUNT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_CONTAINER=${STORAGE_CONTAINER:-kockpit}
      - SPRING_PROFILES_ACTIVE=storageaccount,opensearch
      - OPENSEARCH_ENDPOINTS=http://opensearch:9200
      - INDEX_NAME=audit-data
    depends_on:
      - opensearch

  kockpit-console:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-console:latest
    container_name: kockpit-console
    ports:
      - "3000:80"
    environment:
      - KOCKPIT_BACKEND=http://kockpit-backend-application:8080/backend
    links:
      - kockpit-backend-application:kockpit-backend-application
    depends_on:
      - kockpit-backend-application

  kockpit-sample-all:
    image: ghcr.io/mahieddine-ichir/kockpit/kockpit-sample-all-kafka-storageaccount:latest
    #image: amazoncorretto:21-al2023-headless
    container_name: kockpit-sample-all
    ports:
      - "8081:8081"
    #volumes:
    #  - ../kockpit-samples/kockpit-sample-all/target:/app
    #entrypoint: java -jar /app/kockpit-sample-all-1.0.0-SNAPSHOT.jar
    environment:
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT}
      - STORAGE_ACCOUNT=${STORAGE_ACCOUNT}
      - STORAGE_KEY=${STORAGE_KEY}
      - STORAGE_CONTAINER=${STORAGE_CONTAINER:-kockpit}
      - SPRING_PROFILES_ACTIVE=storageaccount,kafka
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KOCKPIT_SDK_DOMAIN=rcu
      - KOCKPIT_SDK_ENV=local
      - KOCKPIT_SDK_APPID=sample-app
    links:
      - kafka:kafka
    depends_on:
      - kafka
      - kockpit-backend-application
