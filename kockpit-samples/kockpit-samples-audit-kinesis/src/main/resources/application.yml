server:
  port: 8081
  servlet:
    context-path: /sample-kafka

spring:
  application:
    name: app-sample-kafka
  kafka:
    bootstrap-servers: localhost:9092

kockpit:
  sdk:
    domain: test-app
    env: local
    service:
      audit:
        notification:
          topic: audit

logging:
  level:
    org.kockpit.audit.notification.kafka: TRACE
