server:
  servlet:
    context-path: /sample-app
  port: 8082

spring:
  application:
    name: kockpit-samples-all

kockpit:
  domain: kockpit
  env: local
  app-id: ${spring.application.name}

  communication:
    azure:
      storage:
        account: ${STORAGE_ACCOUNT}
        endpoint: https://${kockpit.communication.azure.storage.account}.blob.core.windows.net
        key: ${STORAGE_KEY}
        container: ${STORAGE_CONTAINER:data}
    filesystem:
      path: ${FS_STORAGE_PATH}

    poller:
      scheduling: PT30S

  audit:
    notification:
      kafka:
        topic: audits

  feature-flipping:
    client:
      scheduling: PT10S
    polling:
      enabled: true
  dyna-config:

  heartbeat:
    enabled: true
    polling:
      enabled: false



logging:
  level:
    org.kockpit: TRACE
