name: Build UI
on:
  push:
    branches: ["accor"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - run: npm ci
        working-directory: core-application/console-ui
      - run: npm run build
        working-directory: core-application/console-ui
