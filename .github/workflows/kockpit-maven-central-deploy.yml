name: Deploy libs on maven central

on:
  # Only deploy on release tags (e.g., 1.0.0, 1.0.1)
  push:
    tags:
      - '*'
    paths-ignore:
      - 'kockpit-rules/kockpit-rules-designer/**'
      - 'kockpit-core-applications/kockpit-console/**'
      - 'deployments/**'
      - '.github/workflows/**'
      - '**.md'
  # Allow manual deployment
  workflow_dispatch:
    inputs:
      deploy_modules:
        description: 'Modules to deploy (comma-separated: core,audit,features,all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - core
          - audit
          - features
          - rules

jobs:
  deploy:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.8

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Install Project
        run: mvn clean install -Dmaven.test.skip=true

      - name: Deploy All Modules to Maven Central
        if: github.event.inputs.deploy_modules == 'all' || github.event.inputs.deploy_modules == ''
        run: mvn deploy -Pcentral -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Deploy kockpit-core to Maven Central
        if: github.event.inputs.deploy_modules == 'core'
        run: mvn deploy -Pcentral -f kockpit-core/pom.xml -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Deploy kockpit-audit to Maven Central
        if: github.event.inputs.deploy_modules == 'audit'
        run: mvn deploy -Pcentral -f kockpit-audit/pom.xml -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Deploy kockpit-features to Maven Central
        if: github.event.inputs.deploy_modules == 'features'
        run: mvn deploy -Pcentral -f kockpit-features/pom.xml -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

      - name: Deploy kockpit-rules to Maven Central
        if: github.event.inputs.deploy_modules == 'rules'
        run: mvn deploy -Pcentral -f kockpit-rules/pom.xml -Dmaven.test.skip=true
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

