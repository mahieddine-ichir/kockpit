name: Build Audit Stream Docker Images

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core-applications/kockpit-audit-stream/**'
      - 'kockpit-core-applications/pom.xml'
      - 'pom.xml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core-applications/kockpit-audit-stream/**'
      - 'kockpit-core-applications/pom.xml'
      - 'pom.xml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kockpit-audit-stream-application

jobs:
  build-and-push:
    name: Build and Push Audit Stream Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.8

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Build for Kafka
      - name: Build Kafka Stream Application with Maven
        run: mvn clean package -Pkafka -pl kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application -am -DskipTests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker (Kafka)
        id: meta-kafka
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-kafka
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image (Kafka)
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application
          file: kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application/Dockerfile
          push: true
          tags: ${{ steps.meta-kafka.outputs.tags }}
          labels: ${{ steps.meta-kafka.outputs.labels }}

      # Build for Kinesis
      - name: Build Kinesis Stream Application with Maven
        run: mvn clean package -Pkinesis -pl kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application -am -DskipTests

      - name: Extract Metadata for Docker (Kinesis)
        id: meta-kinesis
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-kinesis
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image (Kinesis)
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application
          file: kockpit-core-applications/kockpit-audit-stream/kockpit-audit-stream-application/Dockerfile
          push: true
          tags: ${{ steps.meta-kinesis.outputs.tags }}
          labels: ${{ steps.meta-kinesis.outputs.labels }}
