name: Build MCP Server Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-ai/**'
      - 'pom.xml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-ai/**'
      - 'pom.xml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kockpit-mcp-server

jobs:
  build-and-push:
    name: Build and Push MCP Server Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.8

      - name: Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # build for AWS profile
      - name: Build MCP Application with Maven (aws)
        run: mvn clean package -Paws -pl kockpit-ai/kockpit-ai-mcp-server/ -am -DskipTests

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta-aws
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}-aws
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-ai/kockpit-ai-mcp-server
          file: kockpit-ai/kockpit-ai-mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta-aws.outputs.tags }}
          labels: ${{ steps.meta-aws.outputs.labels }}

      # build for default profile
      - name: Build Application with Maven (default)
        run: mvn clean package -pl kockpit-ai/kockpit-ai-mcp-server/ -am -DskipTests

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-ai/kockpit-ai-mcp-server
          file: kockpit-ai/kockpit-ai-mcp-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
