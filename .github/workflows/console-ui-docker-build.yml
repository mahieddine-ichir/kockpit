name: Build Console UI Docker Image

on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core-applications/kockpit-console/**'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'kockpit-core-applications/kockpit-console/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kockpit-console

jobs:
  build-and-push:
    name: Build and Push Console UI Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kockpit-core-applications/kockpit-console/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: kockpit-core-applications/kockpit-console

#      - name: Run Linting
#        run: npm run lint
#        working-directory: kockpit-core-applications/kockpit-console

      - name: Build Application (Default)
        run: npm run build
        working-directory: kockpit-core-applications/kockpit-console
        env:
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Copy Static Web App Config (for Azure)
        run: cp ./staticwebapp.config.json ./dist/
        working-directory: kockpit-core-applications/kockpit-console

      - name: Create Default Zip Artifact
        run: |
          cd kockpit-core-applications/kockpit-console/dist
          zip -r ../../../console-ui-dist.zip .

      - name: Build Application (AWS CloudFront)
        run: |
          # Create clean AWS build directory
          rm -rf aws-build
          mkdir aws-build
          cd aws-build

          # Copy entire project structure (excluding node_modules and dist)
          cp -r ../src .
          cp -r ../public .
          cp ../index.html .
          cp ../package.json .
          cp ../package-lock.json .
          cp ../vite.config.js . 2>/dev/null || echo "vite.config.js not found, will create"
          cp ../tailwind.config.js . 2>/dev/null || echo "tailwind.config.js not found"
          cp ../postcss.config.js . 2>/dev/null || echo "postcss.config.js not found"
          cp ../eslint.config.js . 2>/dev/null || echo "eslint.config.js not found"
          cp ../staticwebapp.config.json . 2>/dev/null || echo "staticwebapp.config.json not found"

          # Create AWS-specific config.js with /backend API prefix
          cat > public/config.js << 'EOF'
          window.ENV = {
              VITE_API_BASE: '/backend' // AWS CloudFront API prefix
          }
          EOF

          # Create AWS-optimized vite config
          cat > vite.config.js << 'EOF'
          import { defineConfig } from 'vite'
          import react from '@vitejs/plugin-react'

          export default defineConfig({
            plugins: [react()],
            base: '/',
            define: {
              __BUILD_TIME__: JSON.stringify(process.env.VITE_BUILD_TIME || new Date().toISOString()),
            },
            build: {
              outDir: 'dist'
            }
          })
          EOF

          # Install dependencies and build AWS version
          npm ci
          npm run build
        working-directory: kockpit-core-applications/kockpit-console
        env:
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Create AWS CloudFront Zip Artifact
        run: |
          cd kockpit-core-applications/kockpit-console/aws-build/dist
          zip -r ../../../../console-ui-aws-dist.zip .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: console-ui-builds-${{ github.ref_name }}
          path: |
            console-ui-dist.zip
            console-ui-aws-dist.zip
          retention-days: 30

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: console-ui-${{ github.ref_name }}-latest
          name: Console UI Build - ${{ github.ref_name }}
          files: |
            console-ui-dist.zip
            console-ui-aws-dist.zip
          body: |
            Automated build of Console UI from branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Build Date: ${{ github.event.head_commit.timestamp }}

            **Builds included:**
            - `console-ui-dist.zip`: Standard build (API calls to `/api`)
            - `console-ui-aws-dist.zip`: AWS CloudFront build (API calls to `/backend/api`)

            **For AWS CloudFront integration:**
            Use `console-ui-aws-dist.zip` with your Terraform kockpit-console module.
            This build is pre-configured to work with CloudFront API proxy at `/backend/*`.
          prerelease: ${{ github.ref_name != 'main' }}
          fail_on_unmatched_files: true

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: kockpit-core-applications/kockpit-console
          file: kockpit-core-applications/kockpit-console/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_ENV=${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
            VITE_BUILD_TIME=${{ github.event.head_commit.timestamp }}
