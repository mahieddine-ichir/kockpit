# Kockpit images (GitHub Container Registry). `latest` is built from the default branch.
image:
  registry: ghcr.io/mahieddine-ichir/kockpit
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

# Where every Kockpit pod runs (all components, infrastructure included), e.g. one node of a multi-node cluster:
# with local-path volumes, a volume is created on the node its pod first lands on, and the pod stays there.
#   nodeSelector:
#     kubernetes.io/hostname: office-02
nodeSelector: {}
# e.g. to run on a tainted node
tolerations: []

# ---------------------------------------------------------------------------------------------------------------
# Infrastructure
# ---------------------------------------------------------------------------------------------------------------

kafka:
  # set to false and fill externalBootstrapServers to use an existing Kafka
  enabled: true
  externalBootstrapServers: ""
  image: apache/kafka:4.3.1
  partitions: 3
  persistence:
    enabled: false
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

opensearch:
  # set to false and fill externalUrl to use an existing OpenSearch (security plugin disabled or proxied)
  enabled: true
  externalUrl: ""
  image: opensearchproject/opensearch:3.9.0
  javaOpts: "-Xms512m -Xmx512m"
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
  resources:
    requests: { cpu: 200m, memory: 1Gi }
    limits: { memory: 1536Mi }

dashboards:
  enabled: false
  image: opensearchproject/opensearch-dashboards:3.9.0
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# ---------------------------------------------------------------------------------------------------------------
# Kockpit applications
# ---------------------------------------------------------------------------------------------------------------

# index name shared by the audit stream (writer) and the backend (reader):
# audits are searched through the kockpit-<indexName>-<env>-read alias
indexName: auditdata
# Kafka topic the applications publish audits to and the stream consumes
auditTopic: audits

auditStream:
  enabled: true
  image: kockpit-audit-stream-application-kafka
  env: []
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

backend:
  enabled: true
  image: kockpit-backend-application-filesystem
  # how often the backend reads the shared storage: heartbeats, flag acknowledgements, values (ISO-8601 duration)
  pollInterval: PT5S
  env: []
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

console:
  enabled: true
  image: kockpit-console
  # how often the feature-flipping page refreshes the instances' acknowledgements (ms; 15000 when unset)
  flagsRefreshMs: 5000
  service:
    port: 80
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }

sampleApp:
  # sample application generating audits, see the quick start for its API
  enabled: true
  image: kockpit-sample-all-filesystem
  # how often buffered audits are sent to Kafka
  notificationDelayMs: 5000
  # how often the sample app reads the shared storage for flag and configuration values (ISO-8601 duration)
  pollInterval: PT5S
  env: []
  resources:
    requests: { cpu: 100m, memory: 384Mi }
    limits: { memory: 768Mi }

# Filesystem storage shared by the backend and the sample application (manifests, audit payloads, communication).
# A ReadWriteOnce volume can only be shared by pods on the same node: fine on a single-node cluster.
# With persistence disabled, each pod gets its own emptyDir and the two don't share files.
data:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce

# Manifests copied into the backend's storage on every start (files/manifests/*.json plus the ones below),
# overwriting the copies there: manifest changes saved from the console are lost when the backend restarts.
manifests:
  fromFiles: true
  # extra manifests, file name -> JSON content
  extra: {}

# Console (and /api to the backend) on ingress.host; the ingestion gateway's /ingest on ingress.gatewayHost.
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: kockpit.localhost
  # host of the ingestion gateway (gateway.enabled); no gateway ingress when empty
  gatewayHost: ""
  # TLS certificates from cert-manager: name of a ClusterIssuer (e.g. letsencrypt), one certificate per host
  certManagerClusterIssuer: ""
  # or your own TLS entries (ignored with certManagerClusterIssuer)
  tls: []

# ---------------------------------------------------------------------------------------------------------------
# Shared instance: local accounts, tenants and API keys (see values-public.yaml and deployments/ec2)
# ---------------------------------------------------------------------------------------------------------------

# Local accounts in PostgreSQL: sign up / sign in on the console, self-service tenants and API keys.
# Without it the API is open (quick start) - never expose it like that.
auth:
  local:
    enabled: false
    # accounts may be created from the console's sign-in page
    signupEnabled: true
    # ... with an invitation link only: from the administrator (may create a tenant) or a tenant's owner (joins it).
    # false: anyone can create an account, within per-IP and per-hour limits
    signupInviteRequired: true
    # administrator created at startup (sees every tenant, changes quotas, invites people); its password is in the secret
    adminEmail: ""
  # Values of the generated secret <fullname>-secrets (db-password, jwt-secret, admin-password).
  # Empty = random at install, then kept across upgrades. Or name your own secret holding those keys.
  existingSecret: ""
  dbPassword: ""
  jwtSecret: ""
  adminPassword: ""
  tenants:
    perUser: 1
    keysPerTenant: 3
    dailyQuota: 10000
    maxEnvs: 3
    defaultEnvs: dev

postgres:
  # accounts, tenants, API keys and usage; required by auth.local and the gateway
  enabled: false
  image: postgres:17-alpine
  database: kockpit
  username: kockpit
  persistence:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# HTTP ingestion gateway: applications outside the cluster send audits and messages with an API key
gateway:
  enabled: false
  image: kockpit-gateway-application
  # audit retention forced on every audit (days), i.e. the OpenSearch retention policy
  auditTtlDays: 7
  env: []
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
