{{- if .Values.console.enabled }}
{{- $c := dict "root" . "name" "console" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kockpit.component" $c }}
  labels:
    {{- include "kockpit.labels" $c | nindent 4 }}
spec:
  selector:
    {{- include "kockpit.selectorLabels" $c | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.console.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kockpit.component" $c }}
  labels:
    {{- include "kockpit.labels" $c | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kockpit.selectorLabels" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kockpit.selectorLabels" $c | nindent 8 }}
    spec:
      {{- include "kockpit.scheduling" $ | nindent 6 }}
      {{- include "kockpit.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: console
          image: {{ include "kockpit.image" (dict "root" . "image" .Values.console.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            # nginx proxies /api to ${KOCKPIT_BACKEND}/api
            - name: KOCKPIT_BACKEND
              value: "http://{{ include "kockpit.component" (dict "root" . "name" "backend") }}:8080"
            {{- if .Values.gateway.enabled }}
            # nginx proxies /ingest to ${KOCKPIT_GATEWAY}/ingest: one public address is enough
            - name: KOCKPIT_GATEWAY
              value: "http://{{ include "kockpit.component" (dict "root" . "name" "gateway") }}:8080"
            {{- end }}
            # feature-flipping page refresh (ms): matches the 5 s polling of backend.pollInterval
            - name: FEATURE_FLIPPING_REFRESH_MS
              value: {{ .Values.console.flagsRefreshMs | quote }}
            {{- if .Values.auth.local.enabled }}
            # sign-in / sign-up page and the "Tenant & API keys" page
            - { name: AUTH_MODE, value: local }
            {{- end }}
            {{- with (include "kockpit.ingestUrl" .) }}
            - { name: INGEST_URL, value: {{ . | quote }} }
            {{- end }}
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.console.resources | nindent 12 }}
{{- end }}
