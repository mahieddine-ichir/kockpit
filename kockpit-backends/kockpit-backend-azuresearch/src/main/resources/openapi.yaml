openapi: 3.0.0
info:
  description: Kockpit Backend API
  title: Kockpit backend api
  version: "1.0"
paths:
  /api/audits:
    get:
      operationId: listAudits
      tags:
        - audits
      description: list audits
      parameters:
        - name: start
          description: number of elements to skip
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          description: number of items to return
          in: query
          schema:
            type: integer
            default: 50

      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/page"

  /api/audits/{domain}/{env}:
    get:
      operationId: listAuditsDomainEnv
      tags:
        - audits
      parameters:
        - name: domain
          in: path
          required: true
          schema:
            type: string
        - name: env
          in: path
          required: true
          schema:
            type: string

      description: list audits, for env and domain
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/page"

  /api/audit-reports:
    get:
      operationId: listAuditReports
      tags:
        - auditReports
      description: list all audit reports
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  format: object
  /api/audit-reports/{id}:
    get:
      operationId: auditReportById
      tags:
        - audit reports
      description: details of an audit report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    page:
      type: object
      properties:
        total_count:
          type: integer
          format: int64
        size:
          type: integer
          format: int64
        items:
          type: array
          items:
            format: object
