server:
  port: 8080
  servlet:
    context-path: /backend/api

springdoc:
  api-docs:
    path: /api-docs

spring:
  application:
    name: kockpit-backoffice
  profiles:
    include: opensearch

kockpit:
  sdk:
    domain: rcu
    env: local
    appId: backend-application

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /backend/actuator

