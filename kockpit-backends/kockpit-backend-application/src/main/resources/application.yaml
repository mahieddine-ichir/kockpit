server:
  port: 8080
  servlet:
    context-path: /backend/api

spring:
  application:
    name: kockpit-audit-backoffice

kockpit:
  sdk:
    domain: rcu
    env: local
    appId: any

  audit:
    opensearch:
      index: ${INDEX_NAME}
      endpoints: ${OPENSEARCH_ENDPOINTS}
    azure:
      storage:
        endpoint: ${STORAGE_ENDPOINT}
        account: ${STORAGE_ACCOUNT}
        key: ${STORAGE_KEY}
        container: ${STORAGE_CONTAINER}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /backend/actuator
