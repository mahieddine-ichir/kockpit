server:
  port: 8080
  servlet:
    context-path: /backend/api

spring:
  profiles:
    active: opensearch
  application:
    name: kockpit-audit-backoffice

kockpit:
  sdk:
    domain: rcu
    env: rec
    appId: any

  audit:
    opensearch:
      index: audit-data
      endpoints: http://localhost:9200
    azure:
      storage:
        endpoint: ${STORAGE_ENDPOINT}
        account: ${STORAGE_ACCOUNT}
        key: ${STORAGE_KEY}
        container: ${STORAGE_CONTAINER}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /backend/actuator

