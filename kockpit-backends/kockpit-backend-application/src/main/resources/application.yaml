server:
  port: 8080
  servlet:
    context-path: /backend/api

spring:
  application:
    name: kockpit-audit-backoffice

kockpit:
  sdk:
    domain: rcu
    env: local
    appId: any

  audit:
    azure:
      storage:
        endpoint: ${STORAGE_ENDPOINT}
        account: ${STORAGE_ACCOUNT}
        key: ${STORAGE_KEY}
        container: ${STORAGE_CONTAINER}
        blob: ${STORAGE_BLOB}
      search:
        index_name: ${AZURESEARCH_INDEX}
        endpoint: ${AZURESEARCH_ENDPOINT}
        api_key: ${AZURESEARCH_APIKEY}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      base-path: /backend/actuator