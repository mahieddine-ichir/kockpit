pool:
  vmImage: ubuntu-latest

resources:
  - repo: self

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  dockerRegistryServiceConnection: '22633c42-7472-4e4e-bd7b-cd9f13a87a4d'
  tag: 'latest'

stages:
  - stage: Build
    jobs:
      - job: build
        continueOnError: false
        steps:
          - task: MavenAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts feed'
            inputs:
              artifactsFeeds: 'snapshots,releases'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)
            displayName: Cache Maven local repo

          - task: Maven@4
            displayName: Maven Build
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'
              goals: 'deploy -Pstime'

  - stage: Docker
    jobs:
      - job: image
        continueOnError: false
        condition: and(succeeded(), or(eq(variables['Build.SourceBranch'], 'refs/heads/dev'), eq(variables['Build.SourceBranch'], 'refs/heads/main')))
        steps:
          # Maven build (skipTests to build Image)
          - task: MavenAuthenticate@0
            displayName: 'Authenticate to Azure Artifacts feed'
            inputs:
              artifactsFeeds: 'snapshots,releases'

          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
                maven
              path: $(MAVEN_CACHE_FOLDER)
            displayName: Cache Maven local repo

          - task: Maven@4
            inputs:
              mavenPomFile: 'pom.xml'
              mavenOptions: '-Xmx3072m $(MAVEN_OPTS)'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              jdkArchitectureOption: 'x64'
              options: '-DskipTests'
              goals: 'package'

          - task: Docker@2
            displayName: Build and push an image to container registry kockpit-backend-azuresearch
            inputs:
              command: buildAndPush
              repository: 'kockpit'
              dockerfile: 'kockpit-backends/kockpit-backend-azuresearch/Dockerfile'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)

          - task: Docker@2
            displayName: Build and push an image to container registry kockpit-audit-stream-application-kafka
            inputs:
              command: buildAndPush
              repository: 'kockpit'
              dockerfile: 'kockpit-audit/kockpit-audit-stream/kockpit-audit-stream-application-kafka/Dockerfile'
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: |
                $(tag)
