<table mat-table #table class="dashboard-flow mat-elevation-z8" [dataSource]="dataSource"
       style="overflow-x: scroll">
  <ng-container [matColumnDef]="column.name" *ngFor="let column of timelineProperties;">
    <th mat-header-cell *matHeaderCellDef
        [ngClass]="{'collapse-columns': expandExecutionColumn}">{{ column.name }}
    </th>
    <td mat-cell *matCellDef="let row" [ngClass]="{'collapse-columns': expandExecutionColumn}">
      <wcp-display-value [column]="column" [row]="row"></wcp-display-value>
  </ng-container>
  <ng-container matColumnDef="execution">
    <th mat-header-cell *matHeaderCellDef>Execution Timeline
      <button mat-icon-button class="small-icon-button"
              (click)="toggleExpandCollapseColumn()"
              [matTooltip]="expandExecutionColumn ? 'Collapse timeline' : 'Expand timeline'"
      >
        <mat-icon style="transform: rotate(90deg)">{{ expandExecutionColumn ? 'unfold_less' : 'unfold_more' }}
        </mat-icon>
      </button>

    </th>
    <td mat-cell *matCellDef="let row;" class="timeline-container"
        [ngClass]="{'expand-execution-column': expandExecutionColumn}">
      <div class="timeline-cell">
        <div class="timeline-bar lag" *ngIf="hasLag(row)"
             [style.width.%]="calculateLagPercentage(row, timelineMinTime, timelineMaxTime)"
             [style.margin-left.%]="calculateLagOffsetPercentage(row, timelineMinTime, timelineMaxTime)"
             matTooltip="Lag: {{ calculateLagDuration(row) }} ms"></div>

        <div class="timeline-bar execution"
             [style.width.%]="calculateExecutionPercentage(row, timelineMinTime, timelineMaxTime)"
             [style.margin-left.%]="hasLag(row) ? 0 : calculateExecutionOffsetPercentage(row, timelineMinTime, timelineMaxTime)"
             matTooltip="Execution: {{ calculateExecutionDuration(row) }} ms"></div>
      </div>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="timelineDisplayColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: timelineDisplayColumns;"></tr>

</table>
