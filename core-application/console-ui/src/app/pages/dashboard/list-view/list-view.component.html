<table mat-table #table class="mat-elevation-z8" [dataSource]="dataSource" matSort
       matSortActive="date" matSortDirection="desc" style="overflow-x: scroll">

  <ng-container [matColumnDef]="column.property" *ngFor="let column of columns; let i = index">

    <th mat-header-cell *matHeaderCellDef>
      <span mat-sort-header>{{ column.name }}</span>
    </th>

    <td mat-cell *matCellDef="let row">
      <wcp-display-value [row]="row" [column]="column"></wcp-display-value>
    </td>

  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
